# ---------------------------------------------------------------------------
# Point de vigilance identifié pendant la recherche de sources (à discuter
# avec BF Society en S1) :
#
# Reporters Sans Frontières signale que le paysage médiatique burkinabè
# traverse une période de fortes tensions : plusieurs médias ont fait l'objet
# de suspensions ou de pressions ces dernières années, et certains
# journalistes critiques du pouvoir ont été poussés à l'exil. Concrètement,
# ça veut dire deux choses pour le projet :
#   1. La liste des sources nationales actives peut changer vite (un média
#      suspendu aujourd'hui peut réapparaître, ou l'inverse) — le fichier
#      doit être révisé régulièrement, pas figé une fois pour toutes.
#   2. Le critère "diversité de posture éditoriale" (§2.3) est plus délicat
#      à satisfaire côté national qu'attendu : les médias encore en activité
#      penchent structurellement vers une ligne proche des autorités. À
#      documenter explicitement dans la méthodologie de sélection (livrable
#      §9), plutôt que de prétendre à un équilibre qui n'existe pas
#      pleinement sur le terrain actuellement.
# ---------------------------------------------------------------------------
