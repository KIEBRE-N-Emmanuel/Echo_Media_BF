# Liste de travail pour la validation en semaine 1 (§2.3) — combine médias
# NATIONAUX (Burkina Faso) et INTERNATIONAUX, comme l'exige le titre même du
# projet ("médias nationaux et internationaux"). La première version de ce
# fichier ne comportait que des sources internationales : oubli corrigé.
#
# Statut "verifie: true" = flux RSS confirmé pendant le cadrage (URL testée).
# Statut "verifie: false" = à confirmer en S1, l'URL peut avoir changé.
#
# type: rss | api_gdelt | api_newsapi | scraping
# langue: fr | en

sources:

  # ============ MÉDIAS NATIONAUX (Burkina Faso) ============

  - id: sidwaya
    nom: "Sidwaya"
    type: rss
    langue: fr
    url: "https://www.sidwaya.info/feed"
    verifie: true
    note: "Quotidien national, ancien journal d'État, considéré journal de référence."
    actif: true

  - id: burkina24
    nom: "Burkina24"
